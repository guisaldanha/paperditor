name: Create Release From Tags

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set package version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm pkg set version="$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build installer
        run: npm run build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperditor-${{ matrix.name }}
          if-no-files-found: ignore
          # Caminho sem wildcard no segmento da versão (electron-builder gera em
          # release/<version>/): com wildcard (release/*/*.exe), o upload-artifact
          # preserva o "release/<version>/" dentro do artefato (raiz calculada só até
          # o primeiro *), então o merge-multiple no download job juntava os 3
          # instaladores dentro de uma ÚNICA pasta "<version>/" — daí o
          # "release-assets/<version>" virar um diretório, não um arquivo, e o
          # `gh release create ... release-assets/*` falhar tentando subir a pasta
          # inteira como se fosse um asset.
          path: |
            release/${{ steps.version.outputs.value }}/*.exe
            release/${{ steps.version.outputs.value }}/*.dmg
            release/${{ steps.version.outputs.value }}/*.AppImage

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: paperditor-*
          path: release-assets
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" release-assets/* \
            --title "${{ github.ref_name }}" \
            --notes "See CHANGELOG.md for details."
